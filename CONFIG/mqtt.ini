[Hinweis]
; Bitte die original mqtt.ini nicht ändern, da sie bei Updates überschrieben wird.
; Persönliche Anpassungen stattdessen in einer Kopie als mqtt_priv.ini ablegen.
[mqtt]
; print_level 0=keine Ausgabe 1=Ausgabe 2=jede MQTT-Nachricht ausgeben
mqtt_print_level = 1

; Adresse und Port des MQTT-Brokers
Broker_Address = localhost
Broker_Port = 1883
; Benutzer und Passwort des Brokers, leer lassen wenn der Broker keine Anmeldung verlangt
Broker_User =
Broker_Password =
; Verschlüsselte Verbindung zum Broker 0=nein 1=ja (TLS)
Broker_TLS = 0
; Kennung dieses Programms am Broker
Client_ID = gen24_prognose

; Basis-Topic, darunter werden alle Werte veröffentlicht (ohne führenden Schrägstrich)
; Stundenwerte als JSON: Topic_Base/stunden/Tag  (forecast_00h, diff_00h, geplant_00h, laufend_00h ... 23h, in kW)
; Tagessummen in kWh: Topic_Base/Serie/Tag/sum/wert   Serie = prognose, planung_einmal, planung_laufend, differenz
; Tag = heute, morgen, uebermorgen
Topic_Base = gen24
; Nachrichten am Broker behalten (retained) 0=nein 1=ja
Retain = 1

; Status der Batteriesteuerung (Ladewert, Batterie, Verbrauch ...) bei jedem Lauf von EnergyController.py senden 0=nein 1=ja
; Voraussetzung ist der Hook in EnergyController.py (siehe mqtt_prognose.readme), Topics: Topic_Base/status/<name>
Status_senden = 1

; Webanwendung über MQTT bedienen (ADDONS/mqtt_steuerung.py, Scheduler z.B. jede Minute) 0=nein 1=ja
; geplanter Verbrauch, TAB LadeStrg (Modus, Stunden, Akkuschonung, Ladeleistung, AutoOptions) und TAB Settings (Betriebsart)
; Befehle unter Topic_Base/set/ , siehe ADDONS/mqtt_prognose.readme
Steuerung_empfangen = 1
; Größter erlaubter Wert in kW, größere Werte werden abgelehnt
Geplant_Max_kW = 20

; Adresse der Startseite der Weboberfläche, daraus wird die Adresse von API_forecast.php (im selben Verzeichnis) gebildet
Web_URL = http://localhost/html/index.php
; Zertifikat der Weboberfläche prüfen 0=nein (z.B. selbstsigniertes Zertifikat) 1=ja
Web_SSL_Verify = 1
